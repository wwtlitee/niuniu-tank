<!DOCTYPE html><html><head><meta charset="utf8"><style>body{margin:0;background:#888}</style></head><body>
<script src="/lib/three.min.js"></script>
<script src="/lib/GLTFLoader.js"></script>
<script>
/* 每行 6 个，把 tdkit 全部 tile 系模型摆开拍证件照 */
const NAMES=["dumpster","barrel","chest","coin-gold","crate-strong"];
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x777777);
const scene2=new THREE.Scene(); // 灯光独立场景无用，直接加 scene
const amb=new THREE.AmbientLight(0xffffff,.75);scene.add(amb);
const dir=new THREE.DirectionalLight(0xffffff,.9);dir.position.set(5,10,6);scene.add(dir);
const cam=new THREE.PerspectiveCamera(38,1600/900,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"low-power"});
renderer.setPixelRatio(1);
renderer.setSize(1600,900);renderer.shadowMap.enabled=false;
renderer.domElement.addEventListener("webglcontextlost",e=>{e.preventDefault();setTimeout(()=>renderer.render(scene,cam),50);});
document.body.appendChild(renderer.domElement);
const COL=6,SP=2.2;
const loader=new THREE.GLTFLoader();
let loaded=0;
NAMES.forEach((name,i)=>{
  loader.load(name==="dumpster"?"/assets/roads/"+name+".glb":"/assets/platformer/"+name+".glb",g=>{
    const g2=g.scene;
    const box=new THREE.Box3().setFromObject(g2);
    const size=box.getSize(new THREE.Vector3());
    const s=1.6/Math.max(.01,Math.max(size.x,size.z));
    g2.scale.setScalar(s);
    const col=i%COL,row=(i/COL)|0;
    const cx=(col-(COL-1)/2)*SP, cz=(row-1.5)*SP;
    g2.position.set(cx,0,cz);
    scene.add(g2);
    const cv=document.createElement("canvas");cv.width=cv.height=64;
    const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,64,64);
    ctx.fillStyle="#000";ctx.font="bold 11px monospace";ctx.fillText(name,2,30);
    const tex=new THREE.CanvasTexture(cv);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex}));
    sp.scale.set(1.3,.3,1);sp.position.set(cx,.1,cz+.75);scene.add(sp);
    loaded++;
  },undefined,e=>{console.log("FAIL",name,e&&e.message);});
});
window.__snap=function(){
  cam.position.set(0,10.5,7.5);cam.lookAt(0,0,0);
  renderer.render(scene,cam);
  return loaded;
};
/* 每次加载完成都渲一帧，防止快照时纹理未上传/上下文丢失 */
const iv=setInterval(()=>{try{renderer.render(scene,cam);}catch(e){}},400);
/* 上下文丢失后重建渲染器：新 canvas、同场景 */
window.__rebuild=function(){
  const r2=new THREE.WebGLRenderer({antialias:false});
  r2.setPixelRatio(1);r2.setSize(1600,900);
  document.body.appendChild(r2.domElement);
  window.__snap=function(){
    cam.position.set(0,10.5,7.5);cam.lookAt(0,0,0);
    r2.render(scene,cam);
    return loaded;
  };
  clearInterval(iv);
  const iv2=setInterval(()=>{try{r2.render(scene,cam);}catch(e){}},400);
};
</script></body></html>
